name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege: only the release job needs to write. `contents: write` used
# to be set at the workflow level, which granted it to pull_request runs from
# forks as well.
permissions:
  contents: read

# An APK build is 10-20 minutes of Gradle. Two rapid pushes used to run two of
# them side by side on the same runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The signing secrets are surfaced ONCE, here, as plain environment
    # variables. GitHub rejects the `secrets` context inside a step-level `env:`
    # or `if:` expression with
    #   Unrecognized named-value: 'secrets'. Located at position 1 within
    #   expression: secrets.ANDROID_KEYSTORE_BASE64 != ''
    # and that rejection is fatal for the entire file — the workflow run is
    # created with ZERO jobs, so nothing gets built and the failure shows up as a
    # run named after the file path with no steps to inspect. Reading the secrets
    # through the environment instead also keeps credential material off the
    # shell command line, where `${{ }}` interpolation would otherwise expand a
    # base64 keystore into the process arguments.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # Gradle cache 曾必须关闭：当时仓库只提交了 AndroidManifest.xml，
          # setup-java 找不到任何 **/*.gradle* 可哈希，会直接让 job 失败。android/
          # 现已提交，可以启用。
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dsh_mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # pubspec.yaml is the single source of truth. tag_name / release name /
      # artifact name below all read from here, and the build step injects the
      # same values into the Dart code via --dart-define, so bumping the version
      # is a one-line change with no second place to keep in sync.
      #
      # 解析逻辑只在 scripts/app-version.mjs 里有一份（本地同一个脚本，
      # `node scripts/app-version.mjs` 就能看版本），不再用 sed 复制一份到这里 ——
      # 之前 build/release 两个 job 各写了一遍 sed，改一处漏一处是迟早的事。
      # 它同时解析 android/app/build.gradle 的 applicationId（App 侧用它校验
      # latest.json 是不是给本应用的），解析不到会**报错退出**而不是吐空串。
      - name: Read version from pubspec.yaml
        id: ver
        run: |
          node scripts/app-version.mjs
          node scripts/app-version.mjs --github-output

      - name: Analyze Flutter
        working-directory: ./dsh_mobile
        run: flutter analyze --fatal-warnings

      - name: Test Flutter
        working-directory: ./dsh_mobile
        run: flutter test

      # 网关测试从仓库根跑（root package.json = dsh-mobile-bridge-tests，本身零依赖），
      # 但它们 import 的是 dsh-server-plugin/lib/index.js，那份代码运行时依赖
      # ws / qrcode / yaml。这些依赖只声明在 dsh-server-plugin/package.json 里，
      # 且 node_modules 被 gitignore —— 本地因为目录已存在而全绿，CI 全新 checkout
      # 什么都没有，于是每个测试都死在 "Cannot find module 'ws'"
      # （2026-10-25 实测：tests 461 / pass 432 / 29 个套件 hookFailed）。
      # 这里按提交的 package-lock.json 装依赖；lock 与 package.json 万一不同步，
      # 退回 install 而不是让整条发布流水线因一个脆弱的 lock 直接红掉。
      # [fix 2026-10-28] 两个分支都要带 --legacy-peer-deps：这份 lock 是刻意
      # 不含 cordis peer 树的（见 bridge-tests.yml 的既有结论），裸 npm ci 必
      # 因 peer 冲突失败，于是每次发布都走 install 兜底、装上本不该装的
      # cordis peer —— 测的是重新解析的依赖树，不是提交的那份。两个分支都
      # 带上后，lock 同步时真正走 ci、真正测提交的树。
      - name: Install gateway dependencies
        working-directory: ./dsh-server-plugin
        run: npm ci --no-audit --no-fund --legacy-peer-deps || npm install --no-audit --no-fund --legacy-peer-deps

      - name: Test gateway (hermetic only)
        run: npm test

      - name: Build APK (Release, split per ABI)
        working-directory: ./dsh_mobile
        run: |
          # android/ 现在是**已提交**的（含 build.gradle、MainActivity.kt、
          # proguard-rules.pro、gradle wrapper）。这里不再执行 `flutter create .`
          # 去合成它 —— 那会把上面这些定制文件全部覆盖成模板版本：
          #   - build.gradle 的 signingConfig（可覆盖安装的关键）会被重置成
          #     signingConfigs.debug，导致 APK 再次变成"卸载才能装"；
          #   - MainActivity.kt 里的前台保活服务会消失，推送通知静默失效；
          #   - proguard-rules.pro 会被删掉，而 minifyEnabled 依赖它。
          # `flutter create .` 只在需要从零重建时才有意义，而现在不再是那种情况。
          #
          # 保留 flutter pub get：它负责拉取新增的语音/通知插件依赖。
          flutter pub get

      # 构建用的 Gradle 版本固定在 gradle/wrapper/gradle-wrapper.properties，
      # 因此 gradle cache 可以安全启用 —— 它此前会硬失败，是因为那时仓库里
      # 没有任何 **/*.gradle* 供 cache 的 key 计算使用。
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('dsh_mobile/android/**/*.gradle*', 'dsh_mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Report signing configuration
        # 用 job 级 env 而不是 `${{ secrets.* != '' }}` 表达式 —— GitHub 不接受
        # 在 step 级 env/if 里引用 secrets 上下文。守卫写在脚本里。
        #
        # Unsigned (debug-key) builds are a real product defect, not a warning:
        # Android refuses to install one over an existing app signed with a
        # different key, so every such release forces the user to uninstall —
        # which wipes the stored gateway host and token. The old behaviour
        # (warning, then quietly ship) meant a broken release could go out with
        # a green checkmark. Fail hard on the release path; a PR from a fork has
        # no access to secrets at all, so it keeps building unsigned.
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error title=Unsigned release build::ANDROID_KEYSTORE_BASE64 未设置。"
            if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
              echo "发布路径不允许 debug key 签名：Android 会拒绝覆盖安装，用户必须先卸载（连带丢失网关地址与令牌）。请配置 secrets.ANDROID_KEYSTORE_BASE64 / _PASSWORD / _KEY_PASSWORD / _KEY_ALIAS 后重跑。"
              exit 1
            fi
            echo "非发布路径（PR/分支），本次仅产出不可覆盖安装的调试包，用于验证构建是否通过。"
          else
            echo "ANDROID_KEYSTORE_BASE64 已设置，将产出可覆盖安装的签名包。"
          fi

      - name: Write signing material (when provided)
        working-directory: ./dsh_mobile
        # No step-level `if:` — same `secrets` context restriction. The guard
        # lives in the script, so the step is a no-op when nothing is configured.
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set - nothing to write."
            exit 0
          fi
          mkdir -p android/keystore
          # printf, not echo: echo would append a newline to the base64 payload.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore/release.jks
          EOF
          chmod 600 android/key.properties android/keystore/release.jks
          echo "签名材料已写入，android/app/build.gradle 会读取它。"

      - name: Build APK (Release, split per ABI)
        working-directory: ./dsh_mobile
        # --split-per-abi was missing: the fat APK carries armv7 + arm64 + x64
        # native libraries and measured 22.0-22.8 MB on disk. Per-ABI builds are
        # roughly a third of that. Output filenames change from
        # app-release.apk to app-<abi>-release.apk, hence the glob in the upload
        # and release steps below.
        #
        # 三个 --dart-define 是版本真源链路的最后一跳：App 里的
        # AppVersion.version / buildNumber / packageName 全部读它们
        # （lib/models/app_version.dart），所以**这个构建步骤一旦漏传，装出来的
        # APK 就会带着代码里的兜底默认值**（可能出现"版本号看起来没变"或
        # packageName 校验永远失败）。以后新增任何 flutter build/run 步骤，
        # 都要照抄这三个参数（本地：`node scripts/app-version.mjs --defines`）。
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=APP_VERSION=${{ steps.ver.outputs.version }} \
            --dart-define=APP_BUILD=${{ steps.ver.outputs.build }} \
            --dart-define=APP_PACKAGE_NAME=${{ steps.ver.outputs.package_name }}

      - name: List produced APKs
        working-directory: ./dsh_mobile
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-release-apk-${{ steps.ver.outputs.version }}
          # Glob, not a fixed filename: --split-per-abi emits one APK per ABI.
          path: dsh_mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Job level for the same reason as the build job: keep `secrets` out of
    # step-level expressions. `softprops/action-gh-release` picks GITHUB_TOKEN up
    # from the environment on its own, so nothing has to be repeated per step.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 与 build job 同一份解析逻辑（scripts/app-version.mjs），这里只要 version。
      - name: Read version from pubspec.yaml
        id: ver
        run: node scripts/app-version.mjs --github-output

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: dsh-agent-release-apk-${{ steps.ver.outputs.version }}
          path: dist

      # CHANGELOG.md 现在是 release notes 的事实来源（见该文件开头）。这条路以前
      # 没接上：workflow 一直只开着 generate_release_notes，于是 v1.21.0 发出去时
      # 说明里只有三行 compare 链接，而 CHANGELOG 里那段写得详细得多。
      #
      # 取不到当前版本小节（新版本忘了写）就退回提交列表 —— 宁可发"自上个 tag 起的
      # 提交"，也不要发一个空说明。
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          # [fix 2026-10-28] 小节正文以结尾的 `---` 分隔线收尾：提取时把分隔线
          # 挡掉，否则 Release notes 与 latest.json 的 releaseNotes 末尾都多一行
          # `---`。跳过小节头后第一行就是空行，用 NF/nr 兜住前导空行不重复。
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found=1; next }
            found && /^## / { exit }
            found && /^---[ \t]*$/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          # 去掉结尾空行，notes.md 以正文收尾
          printf '%s\n' "$(cat notes.md)" > notes.md
          if [ -s notes.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "--- CHANGELOG 小节 $VERSION ($(wc -l < notes.md) 行) ---"
            cat notes.md
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "CHANGELOG.md 里没有 $VERSION 小节，退回提交列表"
          fi

      # v1.33.0 之前发布只传 APK，**没有任何人产出 latest.json** —— 于是 App 的
      # 「检查更新」永远拿到 404，只能回退成"检查不可用"。这里补齐发布侧缺的那个
      # 文件；字段与 dsh_mobile/lib/models/client_update.dart 的 UpdateManifest
      # 一一对应，version/versionCode/packageName 仍从 pubspec 与 build.gradle 解析。
      #
      # 选 arm64-v8a 作为清单指向的包：绝大多数在用安卓机是 arm64。清单格式只有
      # 一个 downloadUrl（schemaVersion 1），给"最常见的那一档"比给 fat APK 更省流量；
      # 其余 ABI 仍然可以从发布页手动下载。
      - name: Generate latest.json (client update manifest)
        run: |
          node scripts/latest-manifest.mjs \
            --apk dist/app-arm64-v8a-release.apk \
            --repository "$GITHUB_REPOSITORY" \
            --notes notes.md \
            --out dist/latest.json
          cat dist/latest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Was the literal `v1.3.0`. Every push to main upserted the SAME
          # release, overwriting the previous version's notes and assets — so
          # there was no way to answer "what changed in v1.2.6?".
          tag_name: v${{ steps.ver.outputs.version }}
          name: "DSH Mobile v${{ steps.ver.outputs.version }}"
          # 两者互斥：有 CHANGELOG 小节就用它当正文，没有才让 GitHub 生成提交列表。
          # 不能同时给（那样正文后面会再缀一段自动列表，读起来像两份说明）。
          body_path: ${{ steps.notes.outputs.found == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          # latest.json 必须作为**资产**上传：App 读的是
          # releases/latest/download/latest.json（GitHub 的 latest asset 别名）。
          # 少了它，「检查更新」就退回"不可用"。
          files: |
            dist/*.apk
            dist/latest.json
