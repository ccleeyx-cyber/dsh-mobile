name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Dependencies
        working-directory: ./dsh_mobile
        run: |
          # 备份定制的 Android 配置文件
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK (Release)
        working-directory: ./dsh_mobile
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-release-apk
          path: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.5
          name: "DSH Mobile v1.2.5 - 携带上下文与工作区文档全量默认收缩优化"
          body: |
            ### 🚀 DSH Mobile v1.2.5 发布说明
            
            本次更新彻底解决了对话中携带的上下文、工作区文档（如 AGENTS.md、USER.md 等）、运行环境与技能列表平铺展开导致对话框被万字长文占满的问题：

            #### 📄 1. 携带上下文与 Markdown 文件默认全量折叠 (Collapsible Context Cards)
            - **万字长文彻底折叠**: 无论是 `AGENTS.md` 工作区规则（1.5万字符）、`available_skills` 技能列表（1万字符）、运行时沙箱权限配置，还是用户画像记忆 `USER.md`，全部默认以 ~40px 优雅胶囊卡片呈现，完全不挤占对话空间。
            - **智能元数据与分类徽标**: 自动识别文档来源与类型，高亮展示 `[AGENTS.md]`、`[USER.md]`、`[Skills]`、`[Runtime]`、`[Mnemon]` 徽标与精确字符数。
            - **沉浸式展开与一键收起**: 点击即可展开限制高度的高清 Markdown 滚动面板，底部提供便捷的「收起上下文」按钮。
            - **端云双重多维匹配**: 服务端网关与客户端双引擎实时提取并剥离嵌入式上下文，保障纯净对话流体验。
          files: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
