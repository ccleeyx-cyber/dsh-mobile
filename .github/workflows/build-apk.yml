name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# Least privilege: only the release job needs to write. `contents: write` used
# to be set at the workflow level, which granted it to pull_request runs from
# forks as well.
permissions:
  contents: read

# An APK build is 10-20 minutes of Gradle. Two rapid pushes used to run two of
# them side by side on the same runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # The signing secrets are surfaced ONCE, here, as plain environment
    # variables. GitHub rejects the `secrets` context inside a step-level `env:`
    # or `if:` expression with
    #   Unrecognized named-value: 'secrets'. Located at position 1 within
    #   expression: secrets.ANDROID_KEYSTORE_BASE64 != ''
    # and that rejection is fatal for the entire file — the workflow run is
    # created with ZERO jobs, so nothing gets built and the failure shows up as a
    # run named after the file path with no steps to inspect. Reading the secrets
    # through the environment instead also keeps credential material off the
    # shell command line, where `${{ }}` interpolation would otherwise expand a
    # base64 keystore into the process arguments.
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # `cache: 'gradle'` must stay OFF here. setup-java hashes the Gradle
          # build files to build its cache key, and it FAILS THE JOB when none
          # match:
          #   No file in /home/runner/work/... matched to
          #   [**/*.gradle*,**/gradle-wrapper.properties,...]
          # This repo commits only android/app/src/main/AndroidManifest.xml — the
          # rest of the Gradle project is synthesised later by `flutter create .`,
          # i.e. after this step has already run. Re-enable the cache once
          # android/ is committed properly (ANALYSIS §1.1); until then it can only
          # ever break the build.

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dsh_mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # pubspec.yaml is the single source of truth. tag_name / release name /
      # artifact name below all read from here, so bumping the version is a
      # one-line change instead of the 13-site hunt described in ANALYSIS §1.8.
      - name: Read version from pubspec.yaml
        id: ver
        working-directory: ./dsh_mobile
        run: |
          RAW=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/^version:[[:space:]]*//')
          VERSION="${RAW%%+*}"
          BUILD="${RAW##*+}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD"     >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION"     >> "$GITHUB_OUTPUT"
          echo "APK version=$VERSION build=$BUILD tag=v$VERSION"

      - name: Prepare Android Project & Dependencies
        working-directory: ./dsh_mobile
        run: |
          # 备份定制的 Android 配置文件
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      # Until android/ is committed to this repo, `flutter create .` above
      # regenerates a stock Gradle project whose release build type falls back to
      # signingConfigs.debug. The keystore is ephemeral per runner, so EVERY
      # build is signed with a different key and Android refuses an in-place
      # upgrade — the user has to uninstall, which also wipes the saved host and
      # token. This check cannot fix that (the fix is committing android/ plus a
      # signingConfig that reads key.properties, ANALYSIS §1.1) but it makes the
      # situation visible on every run instead of silently shipping
      # uninstall-only APKs.
      - name: Warn if release signing is not configured
        # Tests the job-level env var instead of a `${{ secrets.* != '' }}`
        # expression, which GitHub does not accept in a step-level `env:`/`if:`.
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning title=Unsigned release build::ANDROID_KEYSTORE_BASE64 is not set and dsh_mobile/android/ is not committed. This APK is signed with the runner's ephemeral debug key, so it CANNOT be installed over a previous build - the user must uninstall first, losing their saved gateway address and token. The fix is committing dsh_mobile/android/ together with a signingConfig that reads key.properties."
          else
            echo "ANDROID_KEYSTORE_BASE64 is set."
          fi

      - name: Write signing material (when provided)
        working-directory: ./dsh_mobile
        # No step-level `if:` — same `secrets` context restriction. The guard
        # lives in the script, so the step is a no-op when nothing is configured.
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ANDROID_KEYSTORE_BASE64 is not set - nothing to write."
            exit 0
          fi
          mkdir -p android/keystore
          # printf, not echo: echo would append a newline to the base64 payload.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/keystore/release.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=keystore/release.jks
          EOF
          chmod 600 android/key.properties android/keystore/release.jks
          echo "Signing material written. Takes effect once android/app/build.gradle is committed with a signingConfig that reads key.properties."

      - name: Build APK (Release, split per ABI)
        working-directory: ./dsh_mobile
        # --split-per-abi was missing: the fat APK carries armv7 + arm64 + x64
        # native libraries and measured 22.0-22.8 MB on disk. Per-ABI builds are
        # roughly a third of that. Output filenames change from
        # app-release.apk to app-<abi>-release.apk, hence the glob in the upload
        # and release steps below.
        run: |
          flutter build apk --release --split-per-abi

      - name: List produced APKs
        working-directory: ./dsh_mobile
        run: ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-release-apk-${{ steps.ver.outputs.version }}
          # Glob, not a fixed filename: --split-per-abi emits one APK per ABI.
          path: dsh_mobile/build/app/outputs/flutter-apk/*.apk
          retention-days: 14
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Job level for the same reason as the build job: keep `secrets` out of
    # step-level expressions. `softprops/action-gh-release` picks GITHUB_TOKEN up
    # from the environment on its own, so nothing has to be repeated per step.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read version from pubspec.yaml
        id: ver
        working-directory: ./dsh_mobile
        run: |
          RAW=$(grep -E '^version:' pubspec.yaml | head -1 | sed 's/^version:[[:space:]]*//')
          echo "version=${RAW%%+*}" >> "$GITHUB_OUTPUT"

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: dsh-agent-release-apk-${{ steps.ver.outputs.version }}
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Was the literal `v1.3.0`. Every push to main upserted the SAME
          # release, overwriting the previous version's notes and assets — so
          # there was no way to answer "what changed in v1.2.6?".
          tag_name: v${{ steps.ver.outputs.version }}
          name: "DSH Mobile v${{ steps.ver.outputs.version }}"
          # Notes belong in a committed CHANGELOG.md, not inlined in CI YAML
          # where their diff is mixed into workflow changes and they are lost
          # whenever the tag is reused. Until CHANGELOG.md exists, fall back to
          # the commit list since the previous tag.
          generate_release_notes: true
          files: dist/*.apk
