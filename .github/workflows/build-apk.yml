name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Dependencies
        working-directory: ./dsh_mobile
        run: |
          # 备份定制的 Android 配置文件
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK (Release)
        working-directory: ./dsh_mobile
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-release-apk
          path: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.4
          name: "DSH Mobile v1.2.4 - 长期记忆快照自动折叠与对话框空间优化"
          body: |
            ### 🚀 DSH Mobile v1.2.4 发布说明
            
            本次更新针对用户发送消息时携带的长期记忆快照（Mnemon Memory Snapshot）占用整个对话框的问题进行了彻底优化：

            #### 🧠 1. 记忆快照自动折叠卡片 (MemoryCard)
            - **长文本不再挤占屏幕**: 针对 `dsh-mnemon` 插件自动召回的数千字记忆快照，自动收纳为高度仅 32px 的精致胶囊卡片，对话框重新恢复清爽。
            - **按需展开与滚动浏览**: 点击胶囊栏即可平滑展开记忆详情，支持在限制高度的容器内滚动查阅与 Markdown 语法高亮展示。
            - **多重记忆源精准识别**: 服务端网关与客户端模型双重校验，无论是独立的记忆事件还是嵌入在消息中的记忆快照，均自动折叠。
          files: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
