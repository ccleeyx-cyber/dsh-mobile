name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Dependencies
        working-directory: ./dsh_mobile
        run: |
          # 备份定制的 Android 配置文件
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK (Release)
        working-directory: ./dsh_mobile
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-release-apk
          path: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          name: "DSH Mobile v1.2.3 - 修复消息显示与新建对话功能"
          body: |
            ### 🚀 DSH Mobile v1.2.3 发布说明
            
            本次更新针对用户发出的消息无法显示、新建会话/清屏新建失效进行了全面修复与底层优化：

            #### 💬 1. 彻底解决用户发出内容看不见的问题
            - **事件结构解析修复**: 修复底层 DSH 协议中 `user/message` 事件内 `content` 数组的正确解包，完整保留并展示用户的提问正文。
            - **本地乐观消息保留**: 客户端在轮询刷新与流式同步时智能保留最近发送的用户消息，防止因服务端延迟写入而被清空。
            - **实时游标智能穿透**: 优化会话历史消息获取逻辑，自动捕获最新 Cursor 游标，确保所有问答记录完整呈现。

            #### ➕ 2. 彻底修复“新建对话”与“清屏新建”失效问题
            - **参数互斥规整**: 修复网关调用 DSH `session/create` 时同时传递 `workspaceId` 与 `cwd` 导致的 RPC 校验失败，现遵循官方规范精确创建。
            - **即时清屏与会话切换**: 点击“清屏新建”或“新建对话”时，立即清空旧界面并展示友好提示，后端创建完毕后秒级切入新会话。
            - **工作区会话列表自动追加**: 新会话创建后自动插入到当前工作区的会话顶部，支持多会话无缝流转。
          files: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
