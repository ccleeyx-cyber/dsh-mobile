name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Dependencies
        working-directory: ./dsh_mobile
        run: |
          # 备份定制的 Android 配置文件
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK (Release)
        working-directory: ./dsh_mobile
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-release-apk
          path: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: "DSH Mobile v1.2.1 - 深度体验优化版"
          body: |
            ### 🚀 DSH Mobile 深度体验优化版 (v1.2.1) 发布
            
            针对移动端会话加载、思考过程展示与交互细节完成深度升级：

            #### 💬 1. 默认定位最新记录与一键直达
            - **自动跳转最新**: 打开对话或切换会话时，不再停留在最早历史记录，而是默认精准呈现最新消息。
            - **一键跳到最新消息**: 当向上翻阅历史消息时，屏幕右下方动态浮现 `[↓ 回到最新消息]` 快捷胶囊，一键丝滑滚回最新动态。

            #### 🧠 2. 智能体思考过程实时加载与流式呈现
            - **思考过程不再滞后**: 修复了之前必须等待全部生成完毕才一次性输出的体验问题。
            - **动态思考卡片**: 发送指令后即刻进入高亮紫色实时推理状态 (`[⚡ 深度思考中...]`)，自动展开并实时呈现规划与思维链。

            #### ⚡ 3. 活跃会话运行态与加载动画
            - **会话顶栏动态标识**: 智能体正在思考或执行工具命令时，顶栏直观呈现 `[⚡ 执行中...]` 动态环形进度指示器。
            - **工作区会话列表状态**: 工作区会话列表同步展示动态旋转 Loading 与 `执行中...` 运行徽章，多项目任务进度一目了然。

            #### 🎨 4. 界面文案与品牌细节深度精简
            - **输入框专属文案**: 输入提示已从占位符调整为纯粹的 `发送消息...`，完全剔除无关第三方名称。
            - **全站品牌统一**: 全面校正为 `DSH Mobile`，打造专属于 DeepSeek Harness 的移动管家。
          files: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
