name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Dependencies
        working-directory: ./dsh_mobile
        run: |
          # 备份定制的 Android 配置文件
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK (Release)
        working-directory: ./dsh_mobile
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-release-apk
          path: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.6
          name: "DSH Mobile v1.2.6 - 会话级模型绑定、工作区任务动态转圈、待确认审批与删除会话清爽升级"
          body: |
            ### 🚀 DSH Mobile v1.2.6 发布说明

            本次更新针对切换会话模型绑定、报错反馈、工作区任务状态可视化、会话删除以及整体极简清爽风格进行了重磅升级：

            #### 🧠 1. 会话级模型独立绑定与实时切换 (Per-Session Model Binding)
            - **会话模型即时生效**: 切换会话时自动读取并展示当前会话真实绑定的模型；点击更换模型直接作用于当前会话，支持服务端持久化。
            - **操作结果双向反馈**: 切换模型成功或失败均有明确的状态提示（Toast / SnackBar），再也不用猜是否生效。

            #### ⚠️ 2. 报错醒目预警提示 (Visual Error Feedback)
            - **全局错误横幅**: 新增顶部可手动关闭的红色错误预警栏，当网关、DSH 服务或网络出现异常时直观展示详细错误原因，杜绝报错静默无提示。
            - **异常捕获与广播**: 服务端网关对所有 prompt 和 model 变更增加完整异常捕获并广播错误状态。

            #### ⚡ 3. 工作区动态指示与待审批操作预警 (Workspace Task & Approval Badges)
            - **炫酷任务执行动画**: 工作区卡片与会话列表中，当前正在执行的任务会展示旋转转圈动画与发光执行胶囊 `[ ⚡ 任务执行中... ]`。
            - **待确认审批预警**: 出现需要手机端确认的工具执行或权限申请时，显示醒目的警示胶囊 `[ ⚠️ 待确认审批 (N 项) ]`。

            #### 🗑️ 4. 完备的会话删除支持 (Session Deletion)
            - **工作区列表一键删除**: 每个会话条目右侧提供删除按钮，并配有防止误触的确认对话框。
            - **对话页面快捷删除**: 对话页面顶部更多菜单与底部操作栏新增「删除当前会话」，确认后自动切换至同工作区其它会话。
            - **底层数据彻底清理**: 网关同步清理 `workspace.json`、`session_projcache`，保障数据干净。

            #### 💎 5. 整体清爽极简 Obsidian 暗黑美学 UI
            - 去除冗余的粗重边框与臃肿组件，重构工作区概览栏与操作面板，界面更轻盈、聚焦与现代。
          files: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
