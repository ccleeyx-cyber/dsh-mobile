name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Dependencies
        working-directory: ./dsh_mobile
        run: |
          # 备份定制的 Android 配置文件
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK (Release)
        working-directory: ./dsh_mobile
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-release-apk
          path: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.2
          name: "DSH Mobile v1.2.2 - 原生流式输出与活跃会话加载动画"
          body: |
            ### 🚀 DSH Mobile 原生流式输出与活跃会话加载动画 (v1.2.2) 发布
            
            针对真实流式输出 (Streaming) 与工作区活跃会话动画进行底层协议级改造：

            #### 🌊 1. 接入 DSH 原生 session/follow 多路复用实时流
            - **底层协议直连**: 服务端网关直连 DSH 引擎的 `session/follow` 多路复用 WebSocket 端口。
            - **真实流式输出**: AI 思考过程与正文回答实时按 Token 增量逐字推送，彻底告别单次全量吐出的滞后感。
            - **思维链动态展开**: 深度思考过程在移动端即刻逐字展开，分析过程与推理分步呈现。

            #### 🔄 2. 工作区与会话列表全局动态加载动画
            - **活跃会话加载指示**: 运行中的会话在工作区列表中呈现呼吸式旋转动画与高亮徽章，多工作区下状态瞬时同步。
            - **WebSocket 实时状态通知**: 无论在会话详情页还是工作区管理页，会话运行态与空闲态均通过 WebSocket 瞬时刷新。
          files: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
