name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Dependencies
        working-directory: ./dsh_mobile
        run: |
          # 备份定制的 Android 配置文件
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK (Release)
        working-directory: ./dsh_mobile
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-release-apk
          path: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.7
          name: "DSH Mobile v1.2.7 - Fluent Design 2 重构、彻底解决会话内容串流与历史会话状态误报"
          body: |
            ### 🚀 DSH Mobile v1.2.7 发布说明

            本次更新重点对会话间隔离机制、历史任务状态判断以及整体视觉风格对齐 Microsoft Fluent Design 2 规范进行了系统性优化：

            #### 🛡️ 1. 彻底解决会话内容“串流”与数据污染 (Session Isolation & Request Sequence Lock)
            - **即时状态重置与请求序列锁**: 点击切换会话时，毫秒级清空旧会话残留消息并复位发送中状态；引入递增序列锁机制，彻底消除快速切换会话时的网络异步乱序覆盖。
            - **严格会话事件守卫**: WebSocket 实时事件（流式输出、思考卡片、工具调用等）对所有未指明或非当前会话的事件坚决拦截，禁止任何跨会话污染。
            - **专属会话轮询机制**: 会话轮询机制与当前会话生命周期强绑定，一旦切换会话立即销毁旧定时器，不再借用或伪造消息。

            #### ⚡ 2. 根除历史会话“执行中0”误报 (Accurate Running State)
            - **多维活跃度检测**: 服务端与客户端增加近期流水线活跃状态校验，避免因底层未闭合的历史记录导致无休止判定为“执行中”。
            - **准确计数与徽标逻辑**: 修正工作区卡片上徽标的判断逻辑，仅在有真实运行任务时显示状态，杜绝任何 `0 执行中` 异常标签。

            #### 🎨 3. Microsoft Fluent Design 2 现代化清爽设计重构
            - **Mica Dark 与 Acrylic 表面**: 采用深度分层的深色 Mica 质感底色与半透明 Acrylic 材质卡片，告别生硬死板的暗黑配色。
            - **Fluent Accent `#0078D4` 标准蓝**: 统一使用 Fluent 现代科技蓝作为主强调色与光晕交互色。
            - **标准微圆角与精致控件**: 规范全套控件（8-10px 表面卡片、6-8px 矩形命令药丸、4px 状态标签与精致 Fluent TextBox 输入框），视觉极其清爽利落。
          files: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
