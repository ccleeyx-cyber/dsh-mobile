name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Prepare Android Project & Dependencies
        working-directory: ./dsh_mobile
        run: |
          # 备份定制的 Android 配置文件
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Build APK (Release)
        working-directory: ./dsh_mobile
        run: |
          flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dsh-agent-release-apk
          path: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.3.0
          name: "DSH Mobile v1.3.0 - 网关核心统一、删除功能修复与凭据治理"
          body: |
            ### 🚀 DSH Mobile v1.3.0 发布说明

            本次为**服务端桥接层重构版本**，配套客户端做了少量配套修复。

            #### 🔧 服务端桥接重构（dsh-server-plugin）
            - **核心逻辑统一**: 新增共享层 `lib/core.mjs`，消除 Cordis 插件入口与独立网关入口的实现分叉；独立网关从 1888 行收薄为 56 行薄壳，两份代码不再各自演进。
            - **补齐缺失端点**: `/api/mobile/personas`（智能体人设）此前仅独立网关提供，客户端连接时无条件调用该接口，在 DSH 内嵌模式下恒返回 404 —— 现已补齐。
            - **修复"删除会话"无效**: 引擎侧不存在 `session/delete` RPC，旧实现吞掉 404 后仍返回 `200 Deleted`，实际未删除任何数据。改为桥接侧真实删除（归档 + 摘除索引 + 清理投影缓存），并对失败如实返回错误。
            - **消除"谎报成功"**: `sessions/delete`、`sessions/cancel` 及取消补偿路径在失败时不再返回 200，改为 5xx 并写入审计日志。
            - **凭据治理**: 移除源码中的明文访问令牌与引擎 HMAC 签名密钥，改为运行时读取 `~/.dsh/.credentials.yaml`；新装环境自动生成随机令牌。

            #### 🔒 安全加固
            - **审批策略绕过修复**: `auto-read` 策略原先按命令前缀白名单放行，`echo hi > out.txt`、`cat x | sh` 这类**写操作/命令注入**可绕过人工审批。现增加 Shell 元字符检测，含重定向、管道、链式与命令替换的命令一律不自动放行。
            - **工作区路径穿越**: 三层校验（`..`/绝对路径/盘符拦截 → 已注册工作区白名单 → 解析后逃逸检查），非法访问返回 403。
            - **请求体上限**: 2MB 限制，超限返回 413 且不再触发客户端 `ECONNRESET`。

            #### 🐛 客户端修复
            - **会话识别统一**: 会话 ID 比较与大小写规则对齐服务端，避免同一会话被误判为两个导致流式状态丢失。
            - **凭据不再预填**: 连接页移除硬编码的默认令牌占位符；APK 下载直链按实际连接的网关动态生成（此前写死 `n.cnm.asia`）。
            - **版本号单一来源**: 版本信息统一由 `pubspec.yaml` 提供，`app_version.dart` 与之保持一致（此前 UI 显示 v1.2.1，实际为 v1.2.9）。

            #### 🧹 工程整理
            - 移除无引用的死代码（`chat_page.dart`、`settings_view.dart`，约 920 行）。
            - 补齐设备配对功能：设备列表真实落盘，配对码改用密码学随机生成（此前恒为 `000000`）。
            - 新增单元测试与 GitHub Actions CI（单元测试 + Flutter 静态分析）。
          files: dsh_mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
