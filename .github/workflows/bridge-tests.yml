name: Bridge Tests

# Hermetic gates only.
#
# The live E2E suites in tests/e2e/** talk to a LIVE bridge on 127.0.0.1:3088
# backed by a real DSH install. They create real sessions, spend real LLM tokens,
# and several of them mutate the developer's real
# ~/.dsh/mobile-access/permissions.json — they cannot run in CI. `npm test` runs
# only tests/unit/**, which is hermetic: each file boots a throwaway bridge on an
# OS-assigned port with its own mkdtempSync DSH_HOME, and the two files that need
# an upstream start a fake engine of their own.
#
# 分层、每个 script 会碰什么、跑前要备份什么：见 docs/TESTING.md
# （原 ANALYSIS-优化与新增功能.md §1.14 / §6.10 已于 2026-10-17 删除）。
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# Two rapid pushes used to run two full Gradle/Flutter jobs side by side and
# fight over the same runner. Cancel the superseded one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a leaked credential is only visible in the commit that
          # introduced it, not in HEAD.
          fetch-depth: 0

      # Blocking: scans the working tree / diff. A new secret in this PR fails.
      - name: Scan working tree (blocking)
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: protect --source . --redact --no-banner --exit-code 1

      # Non-blocking: this repo's history contains a previously-committed engine
      # HMAC credential. It was rotated on 2026-10-08 (the new value takes effect
      # on the next engine restart), so the historical hits are a hygiene debt
      # rather than a usable credential. This step is expected to stay red until
      # the history is rewritten with git filter-repo. Kept visible so the debt is
      # not forgotten, but it must not be the reason a PR cannot merge.
      - name: Scan full history (advisory — expected to fail until history is rewritten)
        continue-on-error: true
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source . --redact --no-banner --log-opts=--all

  unit:
    name: Unit & smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22.15+ 是硬门槛，不是"对齐本地"：网关读会话事件日志要用 Node 内置 zstd
          # （zlib.zstdDecompressSync），该 API 到 Node v22.15.0 才加入。原来钉 20，
          # 于是 sessiontitle 那批用例在 CI 上全部 INVALID（zstdCompressSync 不是函数），
          # 而本机 Node 24 全绿 —— 版本偏差把问题藏住了。同时见 package.json 的 engines。
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dsh-server-plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: ./dsh-server-plugin
        # No `|| npm install` fallback: that silently downgraded to a resolved
        # install whenever the lockfile drifted, so CI could test a different
        # dependency tree than the one that was committed. Drift should fail
        # loudly here, not hide — and it did, on this job's very first run:
        #   Missing: @deepseek-ai/cordis@4.0.4 from lock file
        #   Missing: @deepseek-ai/cosmokit@1.8.5 from lock file
        #   Missing: @standard-schema/spec@1.1.0 from lock file
        #
        # None of those are real dependencies of the plugin. package.json declares
        # only ws + yaml; cordis is a peerDependency, supplied at runtime by the
        # dsh host that loads this plugin. npm >= 7 auto-installs peers, so
        # `npm ci` demands the whole cordis tree be pinned in a lockfile that was
        # generated without it.
        #
        # --legacy-peer-deps restores the correct semantics — do not install the
        # peer, the host provides it — while keeping the strict lockfile check for
        # the dependencies that DO matter (ws, yaml). Regenerating
        # package-lock.json would also work, but that file belongs to the plugin
        # and is being held back with the rest of the gateway changes.
        run: npm ci --omit=dev --legacy-peer-deps

      - name: Run hermetic unit tests
        # Runs from the repo root; the root package.json has no dependencies of
        # its own and relies on Node resolving `ws` upward out of
        # dsh-server-plugin/node_modules. That is fragile but intentional —
        # documented in docs/TESTING.md.
        run: npm run test:unit

  flutter:
    name: Flutter analyze, format & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # 曾刻意关掉 `cache: 'gradle'`：仓库里只有 AndroidManifest.xml，
          # setup-java 找不到任何 **/*.gradle* 可哈希，会直接让 job 失败
          # （"No file in ... matched to [**/*.gradle*, ...]"），而当时
          # Gradle 工程是后面由 `flutter create .` 临时合成的。
          # android/ 现已提交，可以安全启用。
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      # ~/.pub-cache is NOT covered by flutter-action's cache (that caches the
      # SDK only). Without this every run re-downloads the whole dependency set.
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dsh_mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Prepare project & dependencies
        working-directory: ./dsh_mobile
        # android/ 现在是**已提交**的，因此不再执行 `flutter create .` 去合成它。
        # 那一步过去必须做，是因为仓库里只有 AndroidManifest.xml 一个文件；
        # 现在它会把已提交的 build.gradle / MainActivity.kt / proguard-rules.pro
        # 全部覆盖成模板版本（连带把可覆盖安装的签名配置和后台保活服务抹掉）。
        #
        # `flutter create .` 曾顺带生成两个文件，两者都不在仓库里，而这个 step 现在
        # 只跑 `flutter pub get`，不会再顺手生成它们：
        #
        #   - analysis_options.yaml —— 现在**有意提交**（`include:
        #     package:flutter_lints/flutter.yaml`，见 CHANGELOG 1.21.0）。当年它被
        #     删是因为 `flutter analyze` 默认把 infos 当致命问题，首次跑门禁实测到
        #     33 条 `prefer_const_constructors` 之类、job 在碰到真实问题前就死了；
        #     那批 lint 已经清干净，所以这个文件回来了，而且不再被任何 step 删除。
        #   - test/widget_test.dart —— 模板自带的计数器冒烟测试。本 App 没有计数器，
        #     这个测试只可能失败，因此至今没有提交。
        #
        # 现在 CI 评判的与本地 `flutter analyze` / `flutter test` 看到的是同一份
        # 已提交源码。
        run: flutter pub get

      - name: Analyze
        working-directory: ./dsh_mobile
        # Was `--no-fatal-infos --no-fatal-warnings` while the comment above it
        # claimed "treat analyzer infos as failures" — the flag and the comment
        # were exact opposites, so the gate caught nothing at all. Both are fatal
        # now; infos are fatal by default, so the old invocation was actively
        # switching the stricter half off.
        #
        # 当年这条门禁之所以能过，是因为 Prepare 会删掉 `flutter create .` 合成的
        # analysis_options.yaml（那次实测到 33 条 info 全部致命）。现在
        # analysis_options.yaml 已提交、lint 欠账已清，flag 与注释不再对立。
        run: flutter analyze --fatal-warnings

      # 现在仓库里有 37 个 Dart 测试文件（`test/**/*_test.dart`）/ 约 525 条用例 /
      # 9100+ 行（2026-10-17 计数），由 `flutter test --coverage` 全部执行。
      # 此前这里写着"仓库有 3 个 Dart 测试文件 / 12 条用例，而没有任何 workflow 跑过
      # 其中一条"——那是加这条门禁之前的状态。
      - name: Test
        working-directory: ./dsh_mobile
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: dsh_mobile/coverage/lcov.info
          retention-days: 14
