name: Bridge Tests

# Hermetic gates only.
#
# The E2E and challenger suites in this repo talk to a LIVE bridge on
# 127.0.0.1:3088 backed by a real DSH install. They create real sessions, spend
# real LLM tokens, and several of them mutate the developer's real
# ~/.dsh/mobile-access/permissions.json without a reliable restore — they cannot
# run in CI. `npm test` now runs only tests/unit/**, which is hermetic: each of
# the three files boots a throwaway bridge on an OS-assigned port with its own
# mkdtempSync DSH_HOME.
#
# See ANALYSIS-优化与新增功能.md §1.14 and §6.10 for the full inventory of what
# the live suites do to a real environment.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# Two rapid pushes used to run two full Gradle/Flutter jobs side by side and
# fight over the same runner. Cancel the superseded one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a leaked credential is only visible in the commit that
          # introduced it, not in HEAD.
          fetch-depth: 0

      # Blocking: scans the working tree / diff. A new secret in this PR fails.
      - name: Scan working tree (blocking)
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: protect --source . --redact --no-banner --exit-code 1

      # Non-blocking: this repo's history contains a previously-committed engine
      # HMAC credential. It was rotated on 2026-10-08 (the new value takes effect
      # on the next engine restart), so the historical hits are a hygiene debt
      # rather than a usable credential. This step is expected to stay red until
      # the history is rewritten with git filter-repo. Kept visible so the debt is
      # not forgotten, but it must not be the reason a PR cannot merge.
      - name: Scan full history (advisory — expected to fail until history is rewritten)
        continue-on-error: true
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source . --redact --no-banner --log-opts=--all

  unit:
    name: Unit & smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dsh-server-plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: ./dsh-server-plugin
        # No `|| npm install` fallback: that silently downgraded to a resolved
        # install whenever the lockfile drifted, so CI could test a different
        # dependency tree than the one that was committed. Drift should fail
        # loudly here, not hide — and it did, on this job's very first run:
        #   Missing: @deepseek-ai/cordis@4.0.4 from lock file
        #   Missing: @deepseek-ai/cosmokit@1.8.5 from lock file
        #   Missing: @standard-schema/spec@1.1.0 from lock file
        #
        # None of those are real dependencies of the plugin. package.json declares
        # only ws + yaml; cordis is a peerDependency, supplied at runtime by the
        # dsh host that loads this plugin. npm >= 7 auto-installs peers, so
        # `npm ci` demands the whole cordis tree be pinned in a lockfile that was
        # generated without it.
        #
        # --legacy-peer-deps restores the correct semantics — do not install the
        # peer, the host provides it — while keeping the strict lockfile check for
        # the dependencies that DO matter (ws, yaml). Regenerating
        # package-lock.json would also work, but that file belongs to the plugin
        # and is being held back with the rest of the gateway changes.
        run: npm ci --omit=dev --legacy-peer-deps

      - name: Run hermetic unit tests
        # Runs from the repo root; the root package.json has no dependencies of
        # its own and relies on Node resolving `ws` upward out of
        # dsh-server-plugin/node_modules. That is fragile but intentional — see
        # ANALYSIS §6.10.
        run: npm run test:unit

  flutter:
    name: Flutter analyze, format & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          # No `cache: 'gradle'`: setup-java fails the job with "No file in
          # /home/runner/work/... matched to [**/*.gradle*, ...]" when it finds no
          # Gradle build file to hash, and this repo commits only
          # android/app/src/main/AndroidManifest.xml. The Gradle project is
          # synthesised by `flutter create .` further down, i.e. after this step.
          # Re-enable it once android/ is committed properly.

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      # ~/.pub-cache is NOT covered by flutter-action's cache (that caches the
      # SDK only). Without this every run re-downloads the whole dependency set.
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dsh_mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Prepare project & dependencies
        working-directory: ./dsh_mobile
        # The android/ Gradle project is not committed to this repo — only
        # AndroidManifest.xml is. CI has to synthesise the rest, and the manifest
        # has to survive that. Committing android/ properly (ANALYSIS §1.1) would
        # let this whole dance and the cp hack disappear.
        #
        # `flutter create .` also synthesises two files that must NOT survive,
        # because neither is part of this repo and both change what gets judged:
        #
        #   - analysis_options.yaml. Its presence activates the `flutter_lints`
        #     package that pubspec declares but the repo has never configured, and
        #     `flutter analyze` treats infos as fatal by default. Measured on the
        #     first run of this gate: 33 prefer_const_constructors /
        #     prefer_const_literals_to_create_immutables infos, all fatal, so the
        #     job died before reaching a single real problem.
        #   - test/widget_test.dart, the stock counter-increment smoke test. This
        #     app has no counter, so that test can only ever fail. It never
        #     surfaced before because no workflow ran a Dart test at all.
        #
        # Deleting both makes CI analyze and test exactly the committed sources,
        # which is also what a local `flutter analyze` / `flutter test` sees.
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          rm -f analysis_options.yaml test/widget_test.dart
          flutter pub get

      - name: Analyze
        working-directory: ./dsh_mobile
        # Was `--no-fatal-infos --no-fatal-warnings` while the comment above it
        # claimed "treat analyzer infos as failures" — the flag and the comment
        # were exact opposites, so the gate caught nothing at all. Both are fatal
        # now; infos are fatal by default, so the old invocation was actively
        # switching the stricter half off.
        #
        # This is only survivable because the Prepare step deletes the
        # analysis_options.yaml that `flutter create .` synthesises — see the
        # measured 33-info failure documented there.
        #
        # Plan from here: (1) commit an analysis_options.yaml that enables
        # flutter_lints with the high-volume rules explicitly waived and
        # justified, (2) the deprecated_member_use burn-down is already done —
        # MaterialStateProperty ×4 in main_shell.dart and
        # ColorScheme.fromSeed(background:) ×2 in main.dart are gone, and
        # Radio(activeColor:) turns out not to be flagged on 3.24, (3) then stop
        # deleting the generated file and let the lints apply for real.
        run: flutter analyze --fatal-warnings

      # NEW: the repo has 3 Dart test files / 12 tests / 244 lines, and no
      # workflow ever ran a single one of them. Meanwhile CI was running ~83
      # JS assertions that merely grep the Dart sources for string literals —
      # green no matter what the Dart code did, red the moment anyone reformatted
      # it. These tests are the real thing.
      - name: Test
        working-directory: ./dsh_mobile
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: dsh_mobile/coverage/lcov.info
          retention-days: 14
