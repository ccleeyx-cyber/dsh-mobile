name: Bridge Tests

# Hermetic gates only.
#
# The E2E and challenger suites in this repo talk to a LIVE bridge on
# 127.0.0.1:3088 backed by a real DSH install. They create real sessions, spend
# real LLM tokens, and several of them mutate the developer's real
# ~/.dsh/mobile-access/permissions.json without a reliable restore — they cannot
# run in CI. `npm test` now runs only tests/unit/**, which is hermetic: each of
# the three files boots a throwaway bridge on an OS-assigned port with its own
# mkdtempSync DSH_HOME.
#
# See ANALYSIS-优化与新增功能.md §1.14 and §6.10 for the full inventory of what
# the live suites do to a real environment.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

# Two rapid pushes used to run two full Gradle/Flutter jobs side by side and
# fight over the same runner. Cancel the superseded one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a leaked credential is only visible in the commit that
          # introduced it, not in HEAD.
          fetch-depth: 0

      # Blocking: scans the working tree / diff. A new secret in this PR fails.
      - name: Scan working tree (blocking)
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: protect --source . --redact --no-banner --exit-code 1

      # Non-blocking: this repo's history contains a previously-committed engine
      # HMAC credential. It was rotated on 2026-10-08 (the new value takes effect
      # on the next engine restart), so the historical hits are a hygiene debt
      # rather than a usable credential. This step is expected to stay red until
      # the history is rewritten with git filter-repo. Kept visible so the debt is
      # not forgotten, but it must not be the reason a PR cannot merge.
      - name: Scan full history (advisory — expected to fail until history is rewritten)
        continue-on-error: true
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --source . --redact --no-banner --log-opts=--all

  unit:
    name: Unit & smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dsh-server-plugin/package-lock.json

      - name: Install plugin dependencies
        working-directory: ./dsh-server-plugin
        # No `|| npm install` fallback: that silently downgraded to a resolved
        # install whenever the lockfile drifted, so CI could test a different
        # dependency tree than the one that was committed. Drift should fail
        # loudly here, not hide.
        run: npm ci --omit=dev

      - name: Run hermetic unit tests
        # Runs from the repo root; the root package.json has no dependencies of
        # its own and relies on Node resolving `ws` upward out of
        # dsh-server-plugin/node_modules. That is fragile but intentional — see
        # ANALYSIS §6.10.
        run: npm run test:unit

  flutter:
    name: Flutter analyze, format & test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      # ~/.pub-cache is NOT covered by flutter-action's cache (that caches the
      # SDK only). Without this every run re-downloads the whole dependency set.
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('dsh_mobile/pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - name: Prepare project & dependencies
        working-directory: ./dsh_mobile
        # The android/ Gradle project is not committed to this repo — only
        # AndroidManifest.xml is. CI has to synthesise the rest, and the manifest
        # has to survive that. Committing android/ properly (ANALYSIS §1.1) would
        # let this whole dance and the cp hack disappear.
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Analyze
        working-directory: ./dsh_mobile
        # Was `--no-fatal-infos --no-fatal-warnings` while the comment above it
        # claimed "treat analyzer infos as failures" — the flag and the comment
        # were exact opposites, so the gate caught nothing at all.
        #
        # Warnings are fatal now. Infos are deliberately still non-fatal for one
        # more step: this repo has no analysis_options.yaml, so pubspec's
        # declared `flutter_lints` dependency has never actually been activated,
        # and turning infos fatal at the same time as enabling flutter_lints
        # would fail on roughly every widget (use_key_in_widget_constructors —
        # the entire lib contains exactly ONE `key:`) plus ~56 prefer_const
        # hits from withOpacity().
        #
        # Plan: (1) land an analysis_options.yaml that enables flutter_lints with
        # the high-volume rules explicitly waived and justified, (2) burn down
        # the deprecated_member_use infos (MaterialStateProperty ×4 in
        # main_shell.dart, ColorScheme.fromSeed(background:) ×2 in main.dart,
        # Radio(activeColor:) ×1), (3) then flip this to --fatal-infos.
        run: flutter analyze --fatal-warnings

      # NEW: the repo has 3 Dart test files / 12 tests / 244 lines, and no
      # workflow ever ran a single one of them. Meanwhile CI was running ~83
      # JS assertions that merely grep the Dart sources for string literals —
      # green no matter what the Dart code did, red the moment anyone reformatted
      # it. These tests are the real thing.
      - name: Test
        working-directory: ./dsh_mobile
        run: flutter test --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flutter-coverage
          path: dsh_mobile/coverage/lcov.info
          retention-days: 14
