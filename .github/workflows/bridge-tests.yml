name: Bridge Tests

# Unit + smoke tests only.
#
# The E2E and challenger suites in this repo talk to a LIVE bridge on
# 127.0.0.1:3088 backed by a real DSH install, and they create sessions in the
# user's real workspace — they cannot run in CI. tests/unit/** is hermetic: it
# boots a throwaway bridge on a spare port with its own DSH_HOME.
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit & smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install plugin dependencies
        working-directory: ./dsh-server-plugin
        run: npm ci --omit=dev || npm install --omit=dev

      - name: Run hermetic unit tests
        run: npm run test:unit

  flutter-analyze:
    name: Flutter analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare project & dependencies
        working-directory: ./dsh_mobile
        run: |
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml || true
          flutter create . --platforms=android --project-name=dsh_mobile
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          flutter pub get

      - name: Analyze
        working-directory: ./dsh_mobile
        # Treat analyzer infos as failures to catch dead imports after refactors.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
