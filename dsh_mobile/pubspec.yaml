name: dsh_mobile
description: "A modern Android client for DeepSeek Harness (DSH)"
publish_to: "none"
version: 1.10.3+25

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.2

  # Networking & WebSockets
  web_socket_channel: ^3.0.1
  http: ^1.2.1

  # Local Persistence
  shared_preferences: ^2.2.3

  # Markdown & Code Display
  flutter_markdown: ^0.7.2+1

  # 语音输入（§4.2）：调用系统语音识别服务，转成文字填入输入框。
  # 选它而不是自建录音+上传，是因为它零权限成本（RECORD_AUDIO 已在 manifest 声明）、
  # 不需要服务端配合、且能复用手机上已有的识别模型。
  #
  # ⚠️ 版本是**钉死**的，不是随手写的：
  # 7.x 的 android/build.gradle 用 `compileSdk = flutter.compileSdkVersion`，
  # 它依赖 Flutter 把 `flutter` 扩展注入到插件子工程。Flutter 3.24.5 带的
  # plugin-loader v1.0.0 不做这件事，于是构建直接失败：
  #   Could not get unknown property 'flutter' for extension 'android'
  # 6.6.2 用的是朴素的 compileSdkVersion 33 / minSdkVersion 21，没有这个问题。
  # 升级 Flutter 版本、或改用能兼容 7.x 的 plugin-loader 之后，才可以放开这个钉。
  speech_to_text: 6.6.2

  # 本地通知（§4.2 推送通知）：事件发生时弹系统通知。
  # 只用本地通知 + 保持 WS 长连接，不接 FCM —— 这样不依赖任何外部推送服务，
  # 也不需要 Google 服务（国内网络下不可靠）。
  flutter_local_notifications: ^17.2.3

  # 上传图片/文件（§4.2）。两个依赖各司其职：
  #
  # * image_picker：选图片。关键优势是**内置压缩**（maxWidth/maxHeight/imageQuality）。
  #   这不是可选优化 —— 网关的 JSON 请求体有 2MB 上限，而图片要以 base64 内联进
  #   prompt（只有 image part 能让模型真正"看见"图片）。手机直出 12MP 照片约 4MB，
  #   base64 后 5.3MB，必然超限；压到 1600px/80% 通常 200~500KB，安全落在上限内。
  # * file_picker：选任意文件。走独立的原始字节上传路由（32MB 上限），不受 JSON
  #   上限约束，所以不需要压缩。
  image_picker: ^1.1.2
  file_picker: ^8.1.2

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
