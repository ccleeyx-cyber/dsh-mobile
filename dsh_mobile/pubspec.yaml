name: dsh_mobile
description: "A modern Android client for DeepSeek Harness (DSH)"
publish_to: "none"
version: 1.4.0+15

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.6

  # State Management
  provider: ^6.1.2

  # Networking & WebSockets
  web_socket_channel: ^3.0.1
  http: ^1.2.1

  # Local Persistence
  shared_preferences: ^2.2.3

  # Markdown & Code Display
  flutter_markdown: ^0.7.2+1

  # Utilities
  intl: ^0.19.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
